<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MiniSearch</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0e;
      --surface: #161616;
      --border: #2a2a2a;
      --accent: #c8f135;
      --accent-dim: #a0c020;
      --text: #f0f0f0;
      --text-muted: #888;
      --text-faint: #444;
      --radius: 4px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 1.5rem 4rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--text-faint) 1px, transparent 1px),
        linear-gradient(90deg, var(--text-faint) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.07;
      pointer-events: none;
      z-index: 0;
    }

    .everything { position: relative; z-index: 1; width: 100%; max-width: 720px; }

    /* Header */
    header {
      padding: 4rem 0 2.5rem;
      text-align: center;
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.8rem, 8vw, 5rem);
      letter-spacing: -2px;
      line-height: 1;
      color: var(--text);
    }

    .logo span {
      color: var(--accent);
      font-style: italic;
    }

    .tagline {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 0.75rem;
    }

    /* Search box */
    .search-wrap {
      margin-top: 2.5rem;
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 1.1rem;
      padding: 1rem 5rem 1rem 1.25rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-wrap input:focus {
      border-color: var(--accent);
    }

    .search-wrap input::placeholder { color: var(--text-faint); }

    .search-btn {
      position: absolute;
      right: 0.5rem;
      top: 50%;
      transform: translateY(-50%);
      background: var(--accent);
      color: #0e0e0e;
      border: none;
      border-radius: var(--radius);
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      padding: 0.5rem 1rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .search-btn:hover { background: var(--accent-dim); }
    .search-btn:active { transform: translateY(-50%) scale(0.97); }

    /* Status line */
    .status {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 1rem;
      letter-spacing: 0.05em;
      min-height: 1.2rem;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 10px; height: 10px;
      border: 2px solid var(--text-faint);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Results */
    .results { margin-top: 1.5rem; display: flex; flex-direction: column; gap: 1px; }

    .result-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0 1.25rem;
      align-items: start;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.3s ease forwards;
      transition: border-color 0.15s;
    }

    .result-item:hover { border-color: #3a3a3a; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .rank-badge {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--accent);
      background: rgba(200, 241, 53, 0.08);
      border: 1px solid rgba(200, 241, 53, 0.2);
      border-radius: 2px;
      padding: 2px 6px;
      margin-top: 3px;
      white-space: nowrap;
    }

    .result-body { min-width: 0; }

    .result-filename {
      font-family: 'DM Serif Display', serif;
      font-size: 1.05rem;
      color: var(--text);
      margin-bottom: 0.4rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-snippet {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .result-score {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-faint);
      white-space: nowrap;
      padding-top: 4px;
    }

    /* Empty / error states */
    .state-msg {
      text-align: center;
      padding: 3rem 0;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-faint);
      letter-spacing: 0.05em;
    }

    .state-msg .big { font-size: 2rem; display: block; margin-bottom: 0.75rem; }

    /* Footer */
    footer {
      margin-top: 4rem;
      text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: var(--text-faint);
      letter-spacing: 0.08em;
    }

    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="everything">

  <header>
    <div class="logo">Mini<span>Search</span></div>
    <p class="tagline">TF-IDF powered document retrieval</p>
  </header>

  <div class="search-wrap">
    <input type="text" id="queryInput" placeholder="Search documents..." autocomplete="off" />
    <button class="search-btn" onclick="doSearch()">SEARCH</button>
  </div>

  <div class="status" id="status"></div>
  <div class="results" id="results"></div>

  <footer>
    built with FastAPI &amp; TF-IDF &nbsp;·&nbsp;
    <a href="https://github.com/" target="_blank">github</a>
  </footer>

</div>

<script>
  const API = 'https://mini-search-engine-0huy.onrender.com';

  const input   = document.getElementById('queryInput');
  const status  = document.getElementById('status');
  const results = document.getElementById('results');

  input.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

  async function doSearch() {
    const q = input.value.trim();
    if (!q) return;

    results.innerHTML = '';
    status.innerHTML = '<span class="spinner"></span> searching...';

    try {
      const res = await fetch(`${API}/Search?query=${encodeURIComponent(q)}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      const items = Array.isArray(data) ? data : (data.results || []);

      if (!items.length) {
        status.textContent = 'no results found.';
        results.innerHTML = `<div class="state-msg"><span class="big">∅</span>no documents matched your query</div>`;
        return;
      }

      status.textContent = `${items.length} result${items.length > 1 ? 's' : ''} for "${q}"`;

      items.forEach((item, i) => {
        const el = document.createElement('div');
        el.className = 'result-item';
        el.style.animationDelay = `${i * 60}ms`;
        el.innerHTML = `
          <div class="rank-badge">#${item.rank ?? i + 1}</div>
          <div class="result-body">
            <div class="result-filename">${escHtml(item.filename ?? 'untitled')}</div>
            <div class="result-snippet">${escHtml(item.snippet ?? '')}</div>
          </div>
          <div class="result-score">${typeof item.score === 'number' ? item.score.toFixed(4) : ''}</div>
        `;
        results.appendChild(el);
      });

    } catch (err) {
      status.textContent = 'error: ' + err.message;
      results.innerHTML = `<div class="state-msg"><span class="big">⚠</span>${escHtml(err.message)}</div>`;
    }
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
